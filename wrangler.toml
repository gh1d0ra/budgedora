name = "budgedora"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Static front-end. Requests that don't match a file (e.g. /api/*) go to the Worker.
[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "budgedora"
database_id = "58f98c55-af37-406b-a804-8da0828e5cf4"

# Daily cleanup of expired sessions
[triggers]
crons = ["17 4 * * *"]

[observability]
enabled = true
