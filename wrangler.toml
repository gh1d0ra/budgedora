name = "budgedora"
main = "src/worker.ts"
compatibility_date = "2025-09-01"

# Static front-end. Every request runs the Worker first so security headers apply to pages too.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "budgedora"
database_id = "58f98c55-af37-406b-a804-8da0828e5cf4"

# Daily snapshots (daily/… kept 35 days, monthly/… kept forever)
[[kv_namespaces]]
binding = "BACKUPS"
id = "09bd7bf31d8b47d0933db256b1091d24"

[vars]
# Family admins (comma-separated): can create reset links, unlock and restore accounts.
ADMIN_EMAILS = "igorrash@gmail.com"

# Daily: session cleanup + backup snapshot (04:17 UTC)
[triggers]
crons = ["17 4 * * *"]

[observability]
enabled = true
